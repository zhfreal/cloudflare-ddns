name: Build and Upload Go Binaries to Release

# Controls when the workflow will run
on:
  release:
    types: [published] # Trigger workflow when a release is published

# Grant permissions to write contents (needed to upload release assets)
permissions:
  contents: write

jobs:
  build_and_upload:
    name: Build Go Binaries and Upload to Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # Ensures you build the code corresponding to the release tag

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build Go Binaries
        run: |
          VERSION=${{ github.event.release.tag_name }} make build-all

      - name: List built artifacts
        run: ls -l dist/

      - name: Upload Release Assets
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}