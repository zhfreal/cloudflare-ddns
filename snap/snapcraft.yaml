name: cloudflare-ddns
base: core22
version: '26.10.25'

summary: An tool for manage dns records on cloudflare.com
description: This tool can list domains, add update delete domains, list records, add and update delete records.
grade: stable
confinement: strict

architectures:
  - build-on: [amd64]
  - build-on: [arm64]

parts:
  cloudflare-ddns:
    plugin: go
    source: .
    build-snaps:
      - go
    override-build: |
      go build -o $CRAFT_PART_INSTALL/bin/cloudflare-ddns ./cmd/cloudflare-ddns

apps:
  cloudflare-ddns:
    command: bin/cloudflare-ddns
    plugs: [network, network-bind]
